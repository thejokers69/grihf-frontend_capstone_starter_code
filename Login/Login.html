<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StayHealthy | Login</title>
  <link rel="stylesheet" href="Login.css" />
</head>

<body>
  <header class="navbar">
    <div class="navbar-inner">
      <a class="brand" href="../Landing_Page/LandingPage.html">
        <span class="brand-mark" aria-hidden="true">+</span>
        StayHealthy
      </a>
      <nav aria-label="Main">
        <ul class="nav-links">
          <li><a href="../Landing_Page/LandingPage.html">Home</a></li>
          <li><a href="../Landing_Page/LandingPage.html#appointments">Appointments</a></li>
          <li><a href="../Landing_Page/LandingPage.html#doctors">Find a Doctor</a></li>
          <li><a href="../Landing_Page/LandingPage.html#reviews">Reviews</a></li>
        </ul>
      </nav>
      <div class="nav-actions">
        <a class="btn btn-ghost" href="Login.html">Login</a>
        <a class="btn btn-primary" href="../Sign_up/Sign_up.html">Sign Up</a>
      </div>
      <button class="menu-toggle" type="button" aria-label="Open menu">☰</button>
    </div>
  </header>

  <main class="auth-wrap">
    <section class="auth-card" aria-labelledby="login-title">
      <p class="kicker">Welcome back</p>
      <h1 id="login-title">Login to StayHealthy</h1>
      <p class="sub">Access your appointments, doctors, and medical records.</p>

      <form action="#" method="post" novalidate>
        <div class="form-group">
          <label for="email">Email <span class="req">*</span></label>
          <input id="email" name="email" type="email" placeholder="you@example.com" required />
        </div>

        <div class="form-group">
          <label for="password">Password <span class="req">*</span></label>
          <input id="password" name="password" type="password" placeholder="••••••••" required />
        </div>

        <label class="checkbox">
          <input type="checkbox" name="remember" />
          <span>Remember me on this device</span>
        </label>

        <button class="btn btn-primary btn-block" type="submit">Login</button>
      </form>

      <p class="switch-auth">
        <a href="#">Forgot password?</a>
      </p>
      <p class="switch-auth">
        New here? <a href="../Sign_up/Sign_up.html">Create an account</a>
      </p>
    </section>
  </main>

  <p class="footer-note">StayHealthy · Lab layout · Login form</p>
</body>

</html>
